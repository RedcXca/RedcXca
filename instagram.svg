<svg
  width="32"
  height="32"
  viewBox="0 0 32 32"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>Instagram</title>
  <defs>
    <linearGradient
      id="instagram-gradient"
      x1="4"
      y1="28"
      x2="28"
      y2="4"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#ffd600" />
      <stop offset="0.45" stop-color="#ff0169" />
      <stop offset="1" stop-color="#d300c5" />
    </linearGradient>
  </defs>
  <rect
    x="4"
    y="4"
    width="24"
    height="24"
    rx="7"
    fill="none"
    stroke="url(#instagram-gradient)"
    stroke-width="3"
  />
  <circle
    cx="16"
    cy="16"
    r="5.5"
    fill="none"
    stroke="url(#instagram-gradient)"
    stroke-width="3"
  />
  <circle cx="23.5" cy="8.5" r="1.5" fill="#d300c5" />
</svg>
